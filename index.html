<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chamod Lasindu – Invoices</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f4f5;--card:#fff;--tx:#18181b;--mut:#71717a;--bd:#e4e4e7;--red:#e84444;--row:#f1f1f1;--ok:#16a34a;--warn:#d97706;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--card:#1c1c1f;--tx:#f4f4f5;--mut:#a1a1aa;--bd:#33333a;--row:#26262b;--ok:#4ade80;--warn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111113;--card:#1c1c1f;--tx:#f4f4f5;--mut:#a1a1aa;--bd:#33333a;--row:#26262b;--ok:#4ade80;--warn:#fbbf24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.logo{font-weight:800;color:var(--red);letter-spacing:.5px;line-height:1.1}.logo small{display:block;letter-spacing:6px;font-weight:500;font-size:11px}
button,.btn{font:inherit;border:0;border-radius:999px;padding:9px 16px;background:var(--red);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd)}button.sm{padding:5px 11px;font-size:13px}button.del{background:transparent;color:var(--red);padding:4px 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.stats b{display:block;font-size:16px}.stats span{font-size:12px;color:var(--mut)}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.chips{display:flex;gap:6px;margin:10px 0;overflow-x:auto}.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);white-space:nowrap}.chip.on{background:var(--red);color:#fff;border-color:var(--red)}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}.item:hover{border-color:var(--red)}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid currentColor}.Paid{color:var(--ok)}.Partial{color:var(--warn)}.Unpaid{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:2fr 1fr 70px 34px;gap:6px;align-items:center;margin-bottom:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--mut)}.right{text-align:right}
/* invoice sheet: always paper-white */
.sheet{background:#fff;color:#000;border-radius:6px;padding:28px 24px;box-shadow:0 2px 12px #0003;margin-bottom:12px;position:relative;font-size:14px}
.sheet h1{font-size:54px;line-height:1;margin:0;font-weight:800}.sheet .no{font-style:italic;font-weight:800;font-size:22px;margin-top:4px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sheet .logo{font-size:26px;text-align:right}
.pill{display:inline-block;background:#e84444;color:#fff;border-radius:999px;padding:4px 16px;font-size:13px;margin-right:8px}
.tbl{width:100%;border-collapse:collapse;margin-top:22px}.tbl th{padding:7px;font-size:12px;border-radius:999px;box-shadow:0 1px 4px #0003}.tbl th:last-child{background:#e84444;color:#fff}
.tbl td{padding:12px 8px}.tbl tbody tr:nth-child(odd) td{background:#f1f1f1}.tbl td:nth-child(n+2){text-align:center}
.tot{margin:26px 0 0 auto;width:250px;border-radius:16px;box-shadow:0 2px 8px #0003;padding:14px 18px}
.tot div{display:flex;justify-content:space-between;font-size:13px;margin:3px 0}.tot b{letter-spacing:.5px}
.foot{display:flex;flex-wrap:nowrap;gap:6px;justify-content:space-between;margin-top:34px}.foot span{background:#e84444;color:#fff;border-radius:999px;padding:.5em 1.1em;font-size:clamp(4px,1.05vw,10px);font-weight:700;white-space:nowrap}@media print{.foot span{font-size:8.5px}}
.pg1,.pg2{display:flex;flex-direction:column}.pg1 .foot,.pg2 .foot{margin-top:auto;padding-top:60px}.pg1{min-height:0}@page{size:A4;margin:10mm}@media print{.sheet{display:flex;flex-direction:column;min-height:268mm;padding:0}.pg2{flex:1}.tot,.tbl tr,.sheet h3{break-inside:avoid}}
.sheet h3{display:inline-block;background:#f33;color:#fff;border-radius:6px;padding:3px 8px;font-size:14px;margin:20px 0 8px}
.sheet table.bk td{padding:1px 14px 1px 0}.stamp{position:absolute;right:30px;top:120px;border:3px solid #16a34a;color:#16a34a;font-weight:800;font-size:26px;padding:2px 14px;transform:rotate(-12deg);border-radius:8px;opacity:.8}
.err{color:var(--red);font-size:13px}
@media(max-width:560px){.sheet{padding:18px 12px}.sheet h1{font-size:38px}.sheet .logo{font-size:18px}.grid2{grid-template-columns:1fr}.tot{width:100%}.tbl td,.tbl th{padding:8px 3px;font-size:12px}.stamp{top:80px;font-size:18px}}
@media print{body{background:#fff}.noprint{display:none!important}.wrap{padding:0;max-width:none}.sheet{box-shadow:none;margin:0;border-radius:0}.pg2{break-before:auto}}

const B={name:"Chamod Lasindu Amarasinghe",addr:"759/F, Ekamuthu Mawatha, Wennappuwa, Sri Lanka",phone:"+94 71 475 4217",email:"chamodlasinduamarasinghe@gmail.com",
bank:{"Bank Name":"Sampath Bank PLC","Account Name":"A.A.C.L. Amarasinghe","Account Number":"119652851579","Branch":"Dankotuwa","SWIFT Code":"BSAMLKLX"}};
let invs=[],view="list",cur=null,filter="All",q="",db=null,msg="",synced=false,why="";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rs=n=>"Rs. "+(Number(n)||0).toLocaleString("en-US"),pad=n=>String(n).padStart(6,"0"),today=()=>new Date().toISOString().slice(0,10);
function dfmt(d){const x=new Date(d+"T00:00:00"),n=x.getDate(),s=[11,12,13].includes(n%100)?"th":["th","st","nd","rd"][n%10]||"th";
return String(n).padStart(2,"0")+"<sup>"+s+"</sup> "+x.toLocaleString("en-GB",{month:"short"})+" "+x.getFullYear()}
const sub=i=>(i.items||[]).reduce((a,l)=>a+(+l.price||0)*(+l.qty||0),0),net=i=>sub(i)+(+i.tax||0)-(+i.discount||0),
paid=i=>(i.payments||[]).reduce((a,p)=>a+(+p.amount||0),0),bal=i=>net(i)-paid(i),
status=i=>paid(i)<=0?"Unpaid":bal(i)>0?"Partial":"Paid";

try{dels=JSON.parse(localStorage.getItem("gdel")||"{}")}catch(e){}

async function remove(no){invs=invs.filter(x=>x.no!==no);dels[no]=Date.now();lsSave();push()}
function push(){clearTimeout(timer);timer=setTimeout(()=>sync(false),700)}
function merge(ri,rd){const m={};[...invs,...ri].forEach(x=>{if(!m[x.no]||(x.u||0)>(m[x.no].u||0))m[x.no]=x});
 const d={...rd};for(const n in dels)d[n]=Math.max(d[n]||0,dels[n]);dels=d;invs=Object.values(m).filter(x=>!(dels[x.no]>(x.u||0)))}
function getTok(){return new Promise((res,rej)=>{
 if(tok&&Date.now()<tokExp-60000)return res(tok);
 if(!window.google||!google.accounts)return rej(new Error("Google script not loaded (check internet)"));
 if(!tc)tc=google.accounts.oauth2.initTokenClient({client_id:cid,scope:SC,callback:()=>{}});
 tc.callback=r=>{if(r.error)return rej(new Error(r.error));tok=r.access_token;tokExp=Date.now()+r.expires_in*1000;try{localStorage.setItem("gconn","1")}catch(e){}res(tok)};
 tc.error_callback=e=>rej(new Error(e.type||"sign-in cancelled"));
 tc.requestAccessToken({prompt:""})})}

async function findFile(){const r=await(await api("https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent("name='"+FN+"' and trashed=false")+"&fields=files(id)&spaces=drive")).json();return r.files[0]?r.files[0].id:""}
async function sync(manual){if(!cid||busy)return;if(!manual&&!tok&&!localStorage.getItem("gconn"))return;busy=true;sstate="busy";if(manual)render();
 try{if(!fid||manual)fid=await findFile();let ri=[],rd={};
  if(fid){const j=await(await api("https://www.googleapis.com/drive/v3/files/"+fid+"?alt=media")).json();ri=j.invoices||[];rd=j.deleted||{}}
  merge(ri,rd);lsSave();const body=JSON.stringify({invoices:invs,deleted:dels,saved:new Date().toISOString()});
  if(fid){await api("https://www.googleapis.com/upload/drive/v3/files/"+fid+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":"application/json"},body})}
  else{const b="x"+Date.now(),mp="--"+b+"\r\nContent-Type: application/json\r\n\r\n"+JSON.stringify({name:FN,mimeType:"application/json"})+"\r\n--"+b+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+b+"--";
   const r=await(await api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body:mp})).json();fid=r.id}
  localStorage.setItem("gfid",fid);sstate="ok";last=new Date().toLocaleTimeString();msg=""}
 catch(e){sstate="err";msg="Drive sync failed: "+e.message+" (tap Connect Google Drive to retry)";if(/404/.test(e.message)){fid="";localStorage.removeItem("gfid")}}
 busy=false;if(view!=="edit"&&!(document.activeElement&&document.activeElement.tagName==="INPUT"))render()}
function init(){invs=lsLoad();render();
 if(cid){const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=()=>{if(localStorage.getItem("gconn"))sync(false)};document.head.appendChild(s)}
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync(false)});setInterval(()=>sync(false),60000)}

function setCid(){const v=$("#gc").value.trim();if(v){localStorage.setItem("gcid",v);location.reload()}}
function clearCid(){if(confirm("Remove the saved Client ID?")){["gcid","gconn","gfid"].forEach(k=>localStorage.removeItem(k));location.reload()}}
function chip(){
 if(!cid)return `<div class="card"><b>Connect Google Drive</b><p class="muted" style="margin:4px 0">Paste your Google OAuth Client ID once. Until then, invoices are saved on this device only.</p><input id="gc" placeholder="xxxx.apps.googleusercontent.com"><button class="sm" style="margin-top:8px" onclick="setCid()">Save</button></div>`;
 const t=sstate==="ok"?"\u25cf Synced with Google Drive \u00b7 "+last:sstate==="busy"?"Syncing\u2026":sstate==="err"?"\u26a0 Not synced":"Not connected to Google Drive";
 return `<p class="${sstate==="err"?"err":"muted"}" style="margin:0 0 8px;font-size:13px">${t} <button class="sm" onclick="sync(true)">${sstate==="ok"?"Sync now":"Connect Google Drive"}</button> <button class="sm ghost" onclick="clearCid()">Change ID</button></p>`}
function list(){const tot=invs.reduce((a,i)=>a+net(i),0),rec=invs.reduce((a,i)=>a+paid(i),0);
 const rows=invs.filter(i=>(filter==="All"||status(i)===filter)&&(i.no+i.client).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.no.localeCompare(a.no));
 return `${chip()}<div class="stats"><div><span>Invoiced</span><b>${rs(tot)}</b></div><div><span>Received</span><b>${rs(rec)}</b></div><div><span>Outstanding</span><b>${rs(tot-rec)}</b></div></div>
<input style="margin-top:12px" placeholder="Search by client or number" value="${esc(q)}" oninput="q=this.value;clearTimeout(window._t);window._t=setTimeout(()=>{render();const x=document.querySelector('input');x.focus();x.setSelectionRange(99,99)},250)">
<div class="chips">${["All","Unpaid","Partial","Paid"].map(f=>`<button class="chip ${f===filter?"on":""}" onclick="filter='${f}';render()">${f}</button>`).join("")}</div>
${rows.map(i=>`<div class="card item" onclick="go('view','${i.no}')"><div><b>#${i.no} · ${esc(i.client)||"(no client)"}</b><div class="muted">${i.date}${bal(i)>0&&paid(i)>0?" · due "+rs(bal(i)):""}</div></div><div class="right"><b>${rs(net(i))}</b><br><span class="tag ${status(i)}">${status(i)}</span></div></div>`).join("")||`<p class="muted">No invoices yet. Tap “New invoice” to create one.</p>`}
`}
function edit(){const i=cur;return `<div class="card"><div class="grid2"><div><label>Invoice no.</label><input value="${i.no}" ${i.isNew?"":"disabled"} oninput="cur.no=this.value.replace(/\\D/g,'').padStart(6,'0')"></div><div><label>Date</label><input type="date" value="${i.date}" oninput="cur.date=this.value"></div></div>
<label>Invoice to (client name)</label><input value="${esc(i.client)}" oninput="cur.client=this.value"><div class="grid2"><div><label>Address (one line per row)</label><textarea rows="2" oninput="cur.addr=this.value">${esc(i.addr)}</textarea></div><div><label>Phone</label><input type="tel" value="${esc(i.phone)}" oninput="cur.phone=this.value"></div></div></div>
<div class="card"><b>Items</b><div id="items" style="margin-top:8px"></div><button class="ghost sm" onclick="cur.items.push({desc:'',price:'',qty:1});itemsRender()">+ Add item</button>
<div class="grid2"><div><label>Tax / VAT (Rs.)</label><input type="number" inputmode="decimal" value="${i.tax}" oninput="cur.tax=this.value;sums()"></div><div><label>Discount (Rs.)</label><input type="number" inputmode="decimal" value="${i.discount}" oninput="cur.discount=this.value;sums()"></div></div>
<p class="right"><span class="muted">Net total</span> <b id="sums"></b></p></div>
<div class="bar"><button onclick="saveEdit()">Save invoice</button><button class="ghost" onclick="go('list')">Cancel</button></div>`}
function itemsRender(){$("#items").innerHTML=cur.items.map((l,k)=>`<div class="grid3"><input placeholder="Description" value="${esc(l.desc)}" oninput="cur.items[${k}].desc=this.value"><input type="number" inputmode="decimal" placeholder="Price" value="${l.price}" oninput="cur.items[${k}].price=this.value;sums()"><input type="number" placeholder="Qty" value="${l.qty}" oninput="cur.items[${k}].qty=this.value;sums()"><button class="del" onclick="cur.items.splice(${k},1);itemsRender()">✕</button></div>`).join("");sums()}
function sums(){$("#sums").textContent=rs(net(cur))}
async function saveEdit(){if(!cur.client.trim()){msg="Please enter the client name.";render();return}
 if(cur.isNew&&invs.some(x=>x.no===cur.no)){msg="Invoice number "+cur.no+" already exists.";render();return}
 cur.items=cur.items.filter(l=>l.desc.trim()||+l.price);delete cur.isNew;msg="";await save(cur);view="view";render();scrollTo(0,0)}
function show(){const i=cur,s=status(i);return `<div class="bar noprint"><button onclick="window.print()">Print / Save PDF</button><button class="ghost" onclick="view='edit';render()">Edit</button><button class="ghost" onclick="if(confirm('Delete invoice #${i.no}?'))remove('${i.no}').then(()=>go('list'))">Delete</button></div>
<div class="card noprint"><div class="item" style="cursor:default"><b>Payments</b><span class="tag ${s}">${s}</span></div>
<p class="muted" style="margin:4px 0">Paid ${rs(paid(i))} of ${rs(net(i))} · Balance <b style="color:var(--tx)">${rs(bal(i))}</b></p>

<div>${esc(i.client)}<br><span style="white-space:pre-line">${esc(i.addr)}</span><br>${esc(i.phone)}</div>

async function addPay(){const a=+$("#pa").value;if(!(a>0)){msg="Enter the amount received.";render();return}
 cur.payments=[...(cur.payments||[]),{amount:a,date:$("#pd").value||today(),method:$("#pm").value,ref:$("#pr").value.trim()}];msg="";await save(cur);render()}
async function delPay(k){if(!confirm("Remove this payment record?"))return;cur.payments.splice(k,1);await save(cur);render()}
init();
</script></body></html>
